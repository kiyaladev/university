# En-têtes de sécurité du vhost university.naimba.com.
# À déployer dans /etc/nginx/snippets/university-securite.conf.
#
# Inclus au niveau `server` ET dans chaque `location` qui pose son propre
# `add_header` : nginx n'hérite des `add_header` du niveau supérieur que si le
# bloc courant n'en définit aucun.

# HSTS : un an. Pas d'includeSubDomains ni de preload, volontairement.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Piste, NON activée : une CSP stricte risque de casser l'application
# (styles inline de Quasar, service worker, appels à university-api.naimba.com,
# images data:/blob:). À tester d'abord en Content-Security-Policy-Report-Only.
# add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://university-api.naimba.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
