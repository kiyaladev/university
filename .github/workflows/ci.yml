# Intégration continue : vérifications seulement, aucun déploiement, aucun secret.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs factices : prisma generate n'ouvre aucune connexion, et le
  # postinstall du frontend (quasar prepare) exige une API_URL.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
  API_URL: https://university-api.naimba.com/api
  NODE_ENV: test

jobs:
  verifier:
    name: Vérifications (types, tests, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Les bun.lock sont produits par bun 1.4.2 (format 3 pour le backend et
      # le frontend, format 2 pour la passerelle biométrique). Un `bun install`
      # lancé avec bun 1.3.x les réécrit dans un format plus ancien et
      # aplatit les overrides imbriqués : ce contrôle le refuse (voir
      # docs/suivi.md).
      - name: Installation backend
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Installation frontend
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Prisma generate
        working-directory: backend
        run: bunx prisma generate

      # Le schéma est réparti par domaine dans `backend/prisma/schema/` :
      # `prisma validate` vérifie l'ensemble des fichiers d'un coup.
      - name: Validation du schéma Prisma
        working-directory: backend
        run: bunx prisma validate

      - name: Typecheck backend
        working-directory: backend
        run: bun run typecheck

      - name: Typecheck frontend
        working-directory: frontend
        run: bun run typecheck

      - name: Tests backend (Jest)
        working-directory: backend
        run: bun run test

      - name: Tests frontend (Vitest)
        working-directory: frontend
        run: bun run test:unit

      # Le lint passe à 0 erreur des deux côtés : il est bloquant.
      - name: Lint backend
        working-directory: backend
        run: bun run lint

      - name: Lint frontend
        working-directory: frontend
        run: bun run lint

      # Le backend est au format Prettier ; le frontend signale encore huit
      # fichiers, tous dans `frontend/src/features/` (refactorisation en cours
      # parallèlement). Le contrôle reste donc informatif : il redeviendra
      # bloquant quand le frontend sera vert.
      - name: Format backend (non bloquant)
        working-directory: backend
        continue-on-error: true
        run: bun run format:check

      - name: Format frontend (non bloquant)
        working-directory: frontend
        continue-on-error: true
        run: bun run format:check

      # Les énumérations du frontend sont générées depuis le schéma Prisma :
      # le fichier versionné doit correspondre au schéma, sinon la CI échoue.
      - name: Types frontend synchronisés avec le schéma Prisma
        run: bun run types:verifier

  build:
    name: Compilations
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Installation backend
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Installation frontend
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Prisma generate
        working-directory: backend
        run: bunx prisma generate

      - name: Compilation backend
        working-directory: backend
        run: bun run build

      # La compilation du frontend sort dans un dossier temporaire : le
      # dossier servi par nginx n'est jamais touché par une CI.
      - name: Compilation frontend (dossier temporaire)
        working-directory: frontend
        env:
          QA_BUILD_DIR: /tmp/university-ci-pwa
        run: bun run build

      - name: Vérification de la sortie du frontend
        run: test -f /tmp/university-ci-pwa/index.html

  scripts:
    name: Scripts d'exploitation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Les scripts de sauvegarde sont testés sans PostgreSQL ni SSH :
      # pg_dump, pg_restore et rsync sont simulés par des doublures.
      - name: Test des scripts de sauvegarde
        run: node --test scripts/backup-db.spec.mjs scripts/sauvegarde-hors-serveur.spec.mjs

      - name: Vérification de la syntaxe des scripts shell
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done

  biometrie:
    name: Passerelle biométrique
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Installation biometrie
        working-directory: biometrie
        run: bun install --frozen-lockfile

      - name: Typecheck biometrie
        working-directory: biometrie
        run: bun run typecheck
