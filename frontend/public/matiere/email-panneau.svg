<?xml version="1.0" encoding="UTF-8"?>
<!--
  Matière du panneau : grain de brosse et usure d'émail.
  Le bruit est étiré horizontalement (baseFrequency anisotrope) pour donner le
  sens du pinceau, et les mouchetures de la seconde couche imitent l'usure des
  plaques émaillées exposées au soleil. Posé en fond des champs peints à faible
  opacité : c'est de la matière, pas une texture décorative.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="brosse" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85 0.012" numOctaves="3" seed="11" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.55" intercept="0" />
    </feComponentTransfer>
  </filter>

  <filter id="usure" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.42" numOctaves="2" seed="4" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="discrete" tableValues="0 0 0 0 0 0 0.25 0.4" />
    </feComponentTransfer>
  </filter>

  <rect width="320" height="320" filter="url(#brosse)" />
  <rect width="320" height="320" filter="url(#usure)" opacity="0.35" />
</svg>
